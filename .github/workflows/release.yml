name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # triggers on v0.1.0, v1.2.3, etc.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: ulti

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: ulti-linux-x86_64.tar.gz

          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: ulti-macos-arm64.tar.gz

          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: ulti-macos-x86_64.tar.gz

          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: ulti-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # ── Linux / macOS: pack as .tar.gz ──────────────────────────────────────
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ env.BINARY_NAME }}

      # ── Windows: pack as .zip ───────────────────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ env.BINARY_NAME }}.exe -DestinationPath ../../../${{ matrix.archive }}

      - name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          else
            shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          fi

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash ${{ matrix.archive }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding utf8 ${{ matrix.archive }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
            *.sha256

  verify-published-binaries:
    name: Verify README Download (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Test README Ubuntu binary download + 30s rg/fd-find flow
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          sudo apt-get remove -y -qq fd-find || true
          curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ulti-linux-x86_64.tar.gz
          tar xzf ulti-linux-x86_64.tar.gz && chmod +x ulti
          ./ulti --version
          ./ulti "install ripgrep and fd" --dry-run
          printf 'y\n' | ./ulti "install ripgrep and fd"
          fdfind --version
          ./ulti "install ripgrep and fd"

      - name: Test README macOS binary download + flow
        if: matrix.os == 'macos-latest'
        run: |
          curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ulti-macos-arm64.tar.gz
          tar xzf ulti-macos-arm64.tar.gz && chmod +x ulti
          ./ulti --version
          ./ulti "install ripgrep and fd" --dry-run
          printf 'y\n' | ./ulti "install ripgrep and fd"
          rg --version
          fd --version
          ./ulti "install ripgrep and fd"
